<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ORPAWNAGE</title>
	<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
	<link rel="stylesheet" type="text/css" href="assets/css/signup.css">

</head>

<body>

	<div class="container">
		<div class="form-box login">
			<form action="">
				<h1>Sign In</h1>
				<div class="input-box">
					<input type="text" placeholder="Username" required>
					<i class='bx bxs-user'></i>
				</div>
				<div class="input-box">
					<input type="password" placeholder="Password" required>
					<i class='bx bxs-lock-alt' ></i>
				</div>
				<div class="forgot-link">
					<a href="#">Forgot password?</a>
				</div>
				<button type="submit" class="btn">Sign In</button>
				<p>PAW PATROLL!!!!!!!!</p>
				<div class="catdog-icons">
					<a href="#"><i class='bx bxs-dog' ></i></a>
					<a href="#"><i class='bx bxs-cat' ></i></a>
					<a href="#"><i class='bx bxs-dog' ></i></a>
					<a href="#"><i class='bx bxs-cat' ></i></a>
				</div>
			</form>
		</div>
		<div class="form-box register">
			<form action="">
				<h1>Create Account</h1>
				<div class="input-box">
					<input type="text" placeholder="Username" required>
					<i class='bx bxs-user'></i>
				</div>
				<div class="input-box">
					<input type="email" placeholder="Email" required>
					<i class='bx bxs-envelope'></i>
				</div>
				<div class="input-box">
					<input type="password" placeholder="Password" required>
					<i class='bx bxs-lock-alt' ></i>
				</div>
				<button type="submit" class="btn">Sign Up</button>
				<p>PAW PATROLL!!!!!!!!</p>
				<div class="catdog-icons">
					<a href="#"><i class='bx bxs-dog' ></i></a>
					<a href="#"><i class='bx bxs-cat' ></i></a>
					<a href="#"><i class='bx bxs-dog' ></i></a>
					<a href="#"><i class='bx bxs-cat' ></i></a>
				</div>
			</form>
		</div>

		<div class="toggle-box">
			<div class="toggle-panel toggle-left">
				<h1>Join us! Change lives today!</h1>
				<p>Don't have an account?</p>
				<button class="btn register-btn">Sign Up</button>
			</div>
			<div class="toggle-panel toggle-right">
				<h1>Welcome Back! Find love today!</h1>
				<p>Already have an account?</p>
				<button class="btn login-btn">Sign In</button>
			</div>
		</div>
	</div>



	<script src="assets/js/script.js"></script>
</body>

</html>
